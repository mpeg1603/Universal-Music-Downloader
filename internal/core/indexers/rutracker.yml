settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password

login:
  path: forum/login.php
  method: post
  inputs:
    login_username: "{{ .Config.username }}"
    login_password: "{{ .Config.password }}"
    login: вход
  error:
    - selector: "h4.warnColor1.tCenter.mrg_16, div.msg-main"
  captcha:
    selector: "input[name=\"cap_sid\"]"
  test:
    path: forum/index.php
    contains: id="logged-in-username"

search:
  paths:
    - path: forum/tracker.php
  inputs:
    nm: "{{ .Keywords }}"
    f: "{{ join .Categories \",\" }}"
  keywordsfilters:
    - name: replace
      args: ["-", " "]
  rows:
    selector: "table#tor-tbl > tbody > tr:has(td.tor-size > a.tr-dl)"
  fields:
    category:
      selector: td.f-name-col > div.f-name > a
      attribute: href
      filters:
        - name: querystring
          args: f
    title:
      selector: td.t-title-col > div.t-title > a.tLink
    details:
      selector: td.t-title-col > div.t-title > a.tLink
      attribute: href
      filters:
        - name: prepend
          args: "forum/"
    download:
      selector: td.tor-size > a.tr-dl
      attribute: href
      filters:
        - name: prepend
          args: "forum/"
    size:
      selector: td.tor-size
      attribute: data-ts_text
    seeders:
      selector: td:nth-child(7) b
      optional: true
      default: "0"
    leechers:
      selector: td:nth-child(8)
      optional: true
      default: "0"
