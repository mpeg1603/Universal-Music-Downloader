name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg (some tests make test tones with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd)" || (gofmt -l internal cmd; exit 1)
      - run: go vet ./internal/core ./internal/tui ./cmd/universal-music-downloader
      - run: go test ./internal/core ./internal/tui ./cmd/universal-music-downloader

  terminal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
        run: |
          export GOOS=${{ matrix.target }} && export GOOS=${GOOS%/*} GOARCH=${{ matrix.target }} && export GOARCH=${GOARCH#*/}
          ext=""; [ "$GOOS" = windows ] && ext=.exe
          go build -trimpath -ldflags "-s -w" -o "dist/universal-music-downloader$ext" ./cmd/universal-music-downloader

  window-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev g++ pkg-config
      - run: go vet ./internal/gui ./cmd/universal-music-downloader-gui
      - run: go build -trimpath -ldflags "-s -w" -o dist/universal-music-downloader-gui ./cmd/universal-music-downloader-gui

  window-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Keep the build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\go-build
          key: go-window-windows-${{ hashFiles('go.sum') }}
      - name: Build
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/universal-music-downloader-gui.exe ./cmd/universal-music-downloader-gui
